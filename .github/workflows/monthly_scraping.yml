name: 🔄 Pipeline Mensual de Scraping y Analítica Laboral

on:
  # 1. Disparador programado (Cron): Primer día de cada mes a las 00:00 UTC
  schedule:
    - cron: '0 0 1 * *'

  # 2. Disparador manual: Permite ejecutar el pipeline en cualquier momento desde GitHub Actions UI
  workflow_dispatch:
    inputs:
      pages:
        description: 'Número de páginas a scrapear por portal'
        required: false
        default: '5'
      role:
        description: 'Rol de búsqueda'
        required: false
        default: 'cientifico-de-datos'

# Nunca dos corridas en paralelo escribiendo sobre la misma BD
concurrency:
  group: pipeline-mensual
  cancel-in-progress: false

jobs:
  run-labor-intelligence-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Falla en lugar de caer silenciosamente a SQLite si Supabase no responde
      REQUIRE_REMOTE_DB: '1'

    steps:
      - name: 📥 1. Clonar el repositorio
        uses: actions/checkout@v4

      - name: 🐍 2. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # El repositorio es público: el respaldo se sube cifrado (AES-256). Para descifrar:
      #   openssl enc -d -aes-256-cbc -pbkdf2 -pass env:BACKUP_PASSPHRASE -in backup_bd.tar.gz.enc | tar xz
      - name: 🛟 4. Respaldo completo y cifrado de la BD antes de escribir
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Falta el secreto BACKUP_PASSPHRASE: no se escribe en la BD sin respaldo previo."
            exit 1
          fi
          python scripts/backup_bd.py backups
          tar czf - backups | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BACKUP_PASSPHRASE -out backup_bd.tar.gz.enc
          rm -rf backups

      - name: 📤 5. Guardar el respaldo como artefacto (antes de cualquier escritura)
        uses: actions/upload-artifact@v4
        with:
          name: backup-bd-previo-${{ github.run_id }}
          path: backup_bd.tar.gz.enc
          if-no-files-found: error
          retention-days: 90

      # Solo datos de mercado laboral. La generación de propuestas curriculares con IA no corre
      # aquí: su fuente de verdad es el portafolio con decisiones humanas (HITL) en Hetzner.
      - name: 🚀 6. Ejecutar Pipeline Multi-Portal (Scraping + NLP + Modelado + BD histórica)
        run: |
          PAGES="${{ github.event.inputs.pages || '5' }}"
          ROLE="${{ github.event.inputs.role || 'cientifico-de-datos' }}"
          echo ">>> Ejecutando corrida mensual para rol: $ROLE ($PAGES páginas/portal) <<<"
          python main.py --all --role "$ROLE" --pages "$PAGES"

      - name: 📊 7. Subir Datasets Generados como Artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datasets-mensuales-${{ github.run_id }}
          path: |
            data/raw/ofertas_consolidadas.xlsx
            data/processed/ofertas_analizadas.xlsx
            data/analytics/dataset_dashboard_salarios.xlsx
            data/analytics/matriz_ofertas_dashboard.csv
            data/analytics/habilidades_largo_dashboard.csv
          retention-days: 90
